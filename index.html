<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RTX STARS GAME</title>
    <!-- Подключаем официальный скрипт Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #1a1c29 0%, #0e1017 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        /* Шапка профиля */
        .header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 20px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #f39c12, #f1c40f);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: #000;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.4);
        }

        .username {
            font-weight: 600;
            font-size: 16px;
        }

        /* Контейнер Баланса */
        .balance-container {
            text-align: center;
            margin-top: 10px;
        }

        .balance-title {
            font-size: 14px;
            color: #8e9297;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .balance-value {
            font-size: 38px;
            font-weight: 800;
            color: #f1c40f;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-shadow: 0 0 20px rgba(241, 196, 15, 0.3);
        }

        /* Кликер Игры */
        .game-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
        }

        .clicker-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, #2c3e50 0%, #1a252f 100%);
            border: 8px solid rgba(241, 196, 15, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 40px rgba(241, 196, 15, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: transform 0.1s ease, border-color 0.3s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .clicker-btn:active {
            transform: scale(0.95);
            border-color: rgba(241, 196, 15, 0.8);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5), 0 0 50px rgba(241, 196, 15, 0.3);
        }

        .clicker-btn img, .clicker-btn .star-icon {
            font-size: 90px;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        /* Эффект вылетающих цифр */
        .click-effect {
            position: absolute;
            color: #f1c40f;
            font-size: 28px;
            font-weight: 800;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-120px) scale(1.4);
            }
        }

        /* Инструкция / Хинт */
        .hint {
            font-size: 14px;
            color: #8e9297;
            text-align: center;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.02);
            padding: 8px 16px;
            border-radius: 20px;
        }

        /* Футер и кнопка */
        .footer {
            width: 100%;
            margin-top: auto;
            padding-top: 20px;
        }

        .sync-btn {
            width: 100%;
            background: linear-gradient(135deg, #f1c40f 0%, #f39c12 100%);
            color: #000000;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.3);
            transition: transform 0.2s, opacity 0.2s;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .sync-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Верхушка: Игрок -->
    <div class="header">
        <div class="user-info">
            <div class="avatar" id="avatar-letter">U</div>
            <div>
                <div class="username" id="username">Игрок</div>
                <div style="font-size: 12px; color: #4cd137;">Онлайн</div>
            </div>
        </div>
        <div style="font-size: 14px; font-weight: bold; color: #f1c40f;">★ RTX GAME</div>
    </div>

    <!-- Баланс -->
    <div class="balance-container">
        <div class="balance-title">Накликанный баланс</div>
        <div class="balance-value">
            <span id="balance">0</span> <span style="color: #f1c40f;">⭐</span>
        </div>
    </div>

    <!-- Зона кликера -->
    <div class="game-area">
        <div class="clicker-btn" id="click-btn">
            <span class="star-icon">⭐</span>
        </div>
        <div class="hint">Нажимай на звезду, чтобы копить бонусы!</div>
    </div>

    <!-- Кнопка сохранения в бота -->
    <div class="footer">
        <button class="sync-btn" id="sync-btn">Синхронизировать с ботом</button>
    </div>

    <script>
        // Инициализация Telegram WebApp API
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем приложение на весь экран

        // Получаем имя пользователя из Telegram
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('username').textContent = user.first_name + (user.last_name ? ' ' + user.last_name : '');
            document.getElementById('avatar-letter').textContent = user.first_name.charAt(0).toUpperCase();
        }

        let score = 0;
        const balanceEl = document.getElementById('balance');
        const clickBtn = document.getElementById('click-btn');
        const syncBtn = document.getElementById('sync-btn');

        // Клик по звезде
        clickBtn.addEventListener('click', (e) => {
            score++;
            balanceEl.textContent = score;

            // Визуальный эффект вылетающих цифр "+1"
            createClickEffect(e);
            
            // Легкая вибрация телефона при клике
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        });

        function createClickEffect(e) {
            const effect = document.createElement('div');
            effect.className = 'click-effect';
            effect.textContent = '+1';

            // Позиционируем элемент в месте клика
            const rect = clickBtn.getBoundingClientRect();
            let x, y;

            if (e.touches && e.touches.length > 0) {
                x = e.touches[0].clientX - rect.left;
                y = e.touches[0].clientY - rect.top;
            } else {
                x = e.clientX - rect.left;
                y = e.clientY - rect.top;
            }

            effect.style.left = `${x + clickBtn.offsetLeft - 15}px`;
            effect.style.top = `${y + clickBtn.offsetTop - 30}px`;

            document.querySelector('.game-area').appendChild(effect);

            // Удаляем элемент после завершения анимации
            setTimeout(() => {
                effect.remove();
            }, 800);
        }

        // Кнопка сохранения и отправки данных обратно в бота
        syncBtn.addEventListener('click', () => {
            // Подтверждение действия с легкой вибрацией
            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }

            // Отправляем json-команду обратно боту
            const dataToSend = {
                action: "get_balance",
                earned_stars: score
            };

            tg.sendData(JSON.stringify(dataToSend));
            
            // Закрываем WebApp после успешной отправки
            setTimeout(() => {
                tg.close();
            }, 100);
        });
    </script>
</body>
</html>
