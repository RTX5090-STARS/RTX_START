<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTX GLIM</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #050a12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: linear-gradient(180deg, #0d1626 0%, #050a12 100%);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1a2a44;
        }

        .connect-btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 15px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .game-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s;
        }

        .game-card:active {
            transform: scale(0.95);
        }

        .game-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .nav-bar {
            background: #0f172a;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #1e293b;
        }

        .nav-item {
            color: #94a3b8;
            font-size: 10px;
            text-align: center;
            text-decoration: none;
        }

        .nav-item.active {
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div class="header">
    <div style="font-weight: bold;">RTX GLIM</div>
    <button class="connect-btn">Connect</button>
</div>

<div class="grid-container">
    <div class="game-card">
        <div class="game-icon">🚀</div>
        <div>Ракетка</div>
    </div>
    <div class="game-card">
        <div class="game-icon">💣</div>
        <div>Мины</div>
    </div>
    <div class="game-card">
        <div class="game-icon">💎</div>
        <div>Кейсы</div>
    </div>
    <div class="game-card">
        <div class="game-icon">🎮</div>
        <div>PVP</div>
    </div>
    <div class="game-card">
        <div class="game-icon">⛏️</div>
        <div>Кирка</div>
    </div>
    <div class="game-card">
        <div class="game-icon">🏆</div>
        <div>Лидеры</div>
    </div>
</div>

<div class="nav-bar">
    <div class="nav-item">Магазин</div>
    <div class="nav-item">Кейсы</div>
    <div class="nav-item active">Главная</div>
    <div class="nav-item">Лидеры</div>
    <div class="nav-item">Профиль</div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
</script>

</body>
</html>
