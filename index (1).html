<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTX STARS - WebApp Casino & Mini Games</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0d19;
            --card-bg: #151828;
            --accent-cyan: #00f2fe;
            --accent-purple: #7b2cbf;
            --accent-gold: #ffb703;
            --text-color: #ffffff;
            --text-dim: #94a3b8;
            --danger: #ff0055;
            --success: #00e676;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #1f1a3a, #101428);
            border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 12px 18px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .balance-badge {
            background: rgba(255, 183, 3, 0.15);
            border: 1px solid var(--accent-gold);
            padding: 6px 14px;
            border-radius: 20px;
            color: var(--accent-gold);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 480px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            color: var(--text-dim);
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--accent-purple), #4c1d95);
            color: #fff;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(123, 44, 191, 0.4);
        }

        .game-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--accent-cyan);
        }

        /* WHEEL GAME */
        .wheel-box {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 15px 0;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid var(--accent-gold);
            background: conic-gradient(
                #ff0055 0deg 60deg,
                #7b2cbf 60deg 120deg,
                #00f2fe 120deg 180deg,
                #00e676 180deg 240deg,
                #ffb703 240deg 300deg,
                #3a86ff 300deg 360deg
            );
            transition: transform 3s cubic-bezier(0.15, 0.85, 0.35, 1.2);
            box-shadow: 0 0 25px rgba(255, 183, 3, 0.3);
        }

        .wheel-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 20px solid var(--danger);
            z-index: 10;
        }

        /* MINES GAME */
        .mines-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            margin: 15px 0;
        }

        .mine-tile {
            aspect-ratio: 1;
            background: #1e2338;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s;
        }

        .mine-tile.revealed-gem {
            background: rgba(0, 230, 118, 0.2);
            border-color: var(--success);
        }

        .mine-tile.revealed-bomb {
            background: rgba(255, 0, 85, 0.2);
            border-color: var(--danger);
        }

        /* CONTROLS */
        .bet-box {
            width: 100%;
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .bet-input {
            flex: 1;
            background: #0b0d19;
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            font-size: 1rem;
            text-align: center;
            font-weight: 700;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            border: none;
            color: #0b0d19;
            font-weight: 800;
            font-size: 1rem;
            border-radius: 14px;
            cursor: pointer;
            margin-top: 12px;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
            transition: transform 0.1s ease;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .bot-btn {
            margin-top: 15px;
            width: 100%;
            max-width: 480px;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px dashed rgba(255,255,255,0.2);
            color: var(--text-dim);
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: center;
        }

        .result-msg {
            margin-top: 10px;
            font-weight: 700;
            min-height: 24px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">RTX STARS</div>
        <div class="balance-badge">
            <span>⭐</span>
            <span id="userBalance">100</span>
        </div>
    </header>

    <div class="nav-tabs">
        <div class="tab-btn active" onclick="switchGame('wheel')">🎡 Колесо</div>
        <div class="tab-btn" onclick="switchGame('mines')">💣 Мины</div>
    </div>

    <!-- WHEEL GAME CONTAINER -->
    <div id="gameWheel" class="game-container">
        <div class="game-title">КОЛЕСО ФОРТУНЫ</div>
        <div class="wheel-box">
            <div class="wheel-pointer"></div>
            <div id="wheel" class="wheel"></div>
        </div>
        <div class="bet-box">
            <input type="number" id="wheelBet" class="bet-input" value="10" min="5" placeholder="Ставка">
        </div>
        <button class="action-btn" onclick="spinWheel()">КРУТИТЬ (от 5 ⭐)</button>
        <div id="wheelResult" class="result-msg"></div>
    </div>

    <!-- MINES GAME CONTAINER -->
    <div id="gameMines" class="game-container" style="display: none;">
        <div class="game-title">ПОИСК СОКРОВИЩ (4x4)</div>
        <div class="mines-grid" id="minesGrid">
            <!-- 16 tiles dynamically generated -->
        </div>
        <div class="bet-box">
            <input type="number" id="minesBet" class="bet-input" value="10" min="5" placeholder="Ставка">
        </div>
        <button id="minesActionBtn" class="action-btn" onclick="startMinesGame()">НАЧАТЬ ИГРУ</button>
        <div id="minesResult" class="result-msg"></div>
    </div>

    <div class="bot-btn" onclick="sendToBot()">💬 Вернуться в Telegram / Запустить /start</div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
        }

        let userBalance = 100;

        function updateBalanceDisplay() {
            document.getElementById('userBalance').innerText = userBalance;
        }

        function switchGame(game) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('gameWheel').style.display = 'none';
            document.getElementById('gameMines').style.display = 'none';

            if (game === 'wheel') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('gameWheel').style.display = 'flex';
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('gameMines').style.display = 'flex';
                initMinesGrid();
            }
        }

        /* WHEEL LOGIC */
        let isSpinning = false;
        function spinWheel() {
            if (isSpinning) return;
            const betInput = document.getElementById('wheelBet');
            const bet = parseInt(betInput.value);

            if (isNaN(bet) || bet < 5) {
                alert('Минимальная ставка 5 ⭐');
                return;
            }

            if (bet > userBalance) {
                alert('Недостаточно Звёзд на балансе!');
                return;
            }

            userBalance -= bet;
            updateBalanceDisplay();
            isSpinning = true;

            const wheel = document.getElementById('wheel');
            const multipliers = [0, 1.5, 2, 0.5, 3, 0];
            const randomIndex = Math.floor(Math.random() * multipliers.length);
            const degree = 3600 + (randomIndex * 60) + 30;

            wheel.style.transform = `rotate(${degree}deg)`;

            setTimeout(() => {
                isSpinning = false;
                const mult = multipliers[randomIndex];
                const win = Math.floor(bet * mult);
                userBalance += win;
                updateBalanceDisplay();

                const resDiv = document.getElementById('wheelResult');
                if (win > 0) {
                    resDiv.style.color = '#00e676';
                    resDiv.innerText = `🎉 Выигрыш: +${win} ⭐ (x${mult})`;
                } else {
                    resDiv.style.color = '#ff0055';
                    resDiv.innerText = `😢 Не повезло! Вы потеряли ${bet} ⭐`;
                }

                // Send result back to Telegram Bot
                if (tg && tg.sendData) {
                    tg.sendData(JSON.stringify({
                        action: 'game_result',
                        game: 'Wheel',
                        bet: bet,
                        win_amount: win
                    }));
                }
            }, 3200);
        }

        /* MINES LOGIC */
        let minesActive = false;
        let bombIndex = -1;
        let currentMinesBet = 10;

        function initMinesGrid() {
            const grid = document.getElementById('minesGrid');
            grid.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                const tile = document.createElement('div');
                tile.className = 'mine-tile';
                tile.innerText = '❓';
                tile.onclick = () => clickMineTile(i, tile);
                grid.appendChild(tile);
            }
        }

        function startMinesGame() {
            const betInput = document.getElementById('minesBet');
            const bet = parseInt(betInput.value);

            if (isNaN(bet) || bet < 5) {
                alert('Минимальная ставка 5 ⭐');
                return;
            }

            if (bet > userBalance) {
                alert('Недостаточно Звёзд!');
                return;
            }

            userBalance -= bet;
            currentMinesBet = bet;
            updateBalanceDisplay();

            minesActive = true;
            bombIndex = Math.floor(Math.random() * 16);
            initMinesGrid();
            document.getElementById('minesResult').innerText = '🔍 Выберите ячейку!';
        }

        function clickMineTile(index, tile) {
            if (!minesActive) return;

            if (index === bombIndex) {
                tile.innerText = '💣';
                tile.classList.add('revealed-bomb');
                minesActive = false;
                document.getElementById('minesResult').style.color = '#ff0055';
                document.getElementById('minesResult').innerText = '💥 БУМ! Вы наступили на мину!';
                
                if (tg && tg.sendData) {
                    tg.sendData(JSON.stringify({
                        action: 'game_result',
                        game: 'Mines',
                        bet: currentMinesBet,
                        win_amount: 0
                    }));
                }
            } else {
                tile.innerText = '💎';
                tile.classList.add('revealed-gem');
                minesActive = false;
                const win = Math.floor(currentMinesBet * 2);
                userBalance += win;
                updateBalanceDisplay();

                document.getElementById('minesResult').style.color = '#00e676';
                document.getElementById('minesResult').innerText = `🎉 Вы нашли алмаз! +${win} ⭐`;

                if (tg && tg.sendData) {
                    tg.sendData(JSON.stringify({
                        action: 'game_result',
                        game: 'Mines',
                        bet: currentMinesBet,
                        win_amount: win
                    }));
                }
            }
        }

        function sendToBot() {
            if (tg) {
                tg.close();
            } else {
                window.location.href = "https://t.me/RTX5090_STARS_BOT?start=webapp";
            }
        }

        // Initial setup
        initMinesGrid();
    </script>
</body>
</html>
